name: notes-app

services:
  app:
    build:
      context: .
    image: notes-go:1.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-notesdb}
      DB_USER: ${DB_USER:-notes_user}
      DB_PASSWORD: ${DB_PASSWORD:-notes_pass}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - notes-net

  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
      MARIADB_DATABASE: ${DB_NAME:-notesdb}
      MARIADB_USER: ${DB_USER:-notes_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-notes_pass}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    networks:
      - notes-net

networks:
  notes-net:
    name: notes-net
    driver: bridge

volumes:
  mariadb-data:
    name: notes-mariadb-data

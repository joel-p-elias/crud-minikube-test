# Non-secret settings (ConfigMap) and credentials (Secret) shared by app and DB.
apiVersion: v1
kind: ConfigMap
metadata:
  name: notes-config
data:
  PORT: "3000"
  GIN_MODE: release
  DB_HOST: db            # name of the MariaDB Service (cluster DNS)
  DB_PORT: "3306"
  DB_NAME: notesdb
  DB_USER: notes_user
  # Demo only: enables POST /debug/crash so we can show a container restart.
  # Set to "false" for anything that is not a fault-tolerance demo.
  ENABLE_CRASH_ENDPOINT: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secret
type: Opaque
stringData:             # plain text here, stored base64-encoded by Kubernetes
  MARIADB_ROOT_PASSWORD: root_pass   # course/demo value - use a real secret store in production
  MARIADB_PASSWORD: notes_pass

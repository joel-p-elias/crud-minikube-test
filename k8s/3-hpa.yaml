apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notes-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notes
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization       # % of the pod's CPU *request* (50m) -> scale up above 25m average
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # wait 300s of low load before removing pods
